name: Build custom Docker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Version, for example vcustom-20260722-02"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ inputs.image_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validate version
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^vcustom-[0-9]{8}-[0-9]{2}$ ]]; then
            echo "Version must look like vcustom-20260722-02"
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
          build-args: |
            VERSION=${{ inputs.image_tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
